name: M01.3B B1 preparation and preserved regressions

on:
  push:
    branches:
      - codex/m01-3b-hosted-supabase-pilot

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_UI_LANGUAGE: en
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
        env:
          POSTGRES_PASSWORD: m013b-public-bootstrap-only
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --set=cluster_name=m012_disposable_m013b_ci
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout exact push without stored credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify base identity and protected baseline and approved M01.3A fixes
        run: ./build/auth-pilot/preservation.ps1

      - name: Install exact SDK without dependency cache
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.402'
          cache: false

      - name: M01.3B B1 tests with simulated HTTPS Auth and disposable SQL
        env:
          M012_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          M012_BOOTSTRAP_PASSWORD: m013b-public-bootstrap-only
          M012_CLUSTER_MARKER: m012_disposable_m013b_ci
          NUGET_PACKAGES: ${{ runner.temp }}/m013-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/m013-nuget-http-cache
        run: ./build/auth-pilot/check.ps1 -Dotnet dotnet

      - name: Unchanged 64 M01.3A tests and audit
        env:
          M012_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          M012_BOOTSTRAP_PASSWORD: m013b-public-bootstrap-only
          M012_CLUSTER_MARKER: m012_disposable_m013b_ci
          NUGET_PACKAGES: ${{ runner.temp }}/m013-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/m013-nuget-http-cache
        run: ./build/auth/check.ps1 -Dotnet dotnet

      - name: Unchanged 61 M01.2 tests and audit
        env:
          M012_TEST_PORT: ${{ job.services.postgres.ports[5432] }}
          M012_BOOTSTRAP_PASSWORD: m013b-public-bootstrap-only
          M012_CLUSTER_MARKER: m012_disposable_m013b_ci
          NUGET_PACKAGES: ${{ runner.temp }}/m013-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/m013-nuget-http-cache
        run: ./build/identity/check.ps1 -Dotnet dotnet

      - name: Unchanged 21 M01.1 tests and audit
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/m013-nuget-packages
          NUGET_HTTP_CACHE_PATH: ${{ runner.temp }}/m013-nuget-http-cache
        run: |
          ./build/web/check.ps1 -Dotnet dotnet
          ./build/identity/verify-results.ps1 -Trx ./tmp/m011/check/m011.trx -Assembly TradingAgent.Web.Tests.dll -Expected ./build/identity/expected-m011-tests.json -Summary ./artifacts/m013b/m011-summary.json

      - name: Validate complete evidence and isolation
        if: always()
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('identity.json','sdk-version.txt','restore.log','build.log','dependencies.json','m013b.trx','summary.json','isolation.json','m011-summary.json')) {
            if (!(Test-Path -LiteralPath "./artifacts/m013b/$file")) { throw "Missing M01.3 evidence: $file" }
          }
          $current = Get-Content ./artifacts/m013b/summary.json -Raw | ConvertFrom-Json
          $prior = Get-Content ./artifacts/m013/summary.json -Raw | ConvertFrom-Json
          $m012 = Get-Content ./artifacts/m012/summary.json -Raw | ConvertFrom-Json
          $m011 = Get-Content ./artifacts/m013b/m011-summary.json -Raw | ConvertFrom-Json
          $isolation = Get-Content ./artifacts/m013b/isolation.json -Raw | ConvertFrom-Json
          $identity = Get-Content ./artifacts/m013b/identity.json -Raw | ConvertFrom-Json
          if ($current.passed -ne 120 -or $prior.passed -ne 64 -or $m012.passed -ne 61 -or $m011.passed -ne 21 -or $isolation.connections_outside_disposable_postgres -ne 0 -or $identity.preservation -ne 'PASS') { throw 'Incomplete checks.' }
          "M01.3B:120 (76 preserved +44 JWT diagnostic regressions); M01.3A:64; M01.2:61; M01.1:21 passed, no failures/skips. PostgreSQL:$($isolation.postgres_version). Auth uses in-process HTTP TestServer with ephemeral signing keys. No hosted Supabase validation. OFFLINE / NO_TRADE; independent audit pending." >> $env:GITHUB_STEP_SUMMARY

      - name: Preserve allowlisted evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m013b-preparation-evidence-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            artifacts/m013b/identity.json
            artifacts/m013b/sdk-version.txt
            artifacts/m013b/restore.log
            artifacts/m013b/build.log
            artifacts/m013b/dependencies.json
            artifacts/m013b/m013b.trx
            artifacts/m013b/summary.json
            artifacts/m013b/isolation.json
            artifacts/m013b/m011-summary.json
            artifacts/m013/sdk-version.txt
            artifacts/m013/restore.log
            artifacts/m013/build.log
            artifacts/m013/dependencies.json
            artifacts/m013/m013.trx
            artifacts/m013/summary.json
            artifacts/m013/isolation.json
            artifacts/m012/restore.log
            artifacts/m012/build.log
            artifacts/m012/dependencies.json
            artifacts/m012/m012.trx
            artifacts/m012/summary.json
            artifacts/m012/isolation.json
            tmp/m011/check/restore.log
            tmp/m011/check/build.log
            tmp/m011/check/dependencies.json
            tmp/m011/check/m011.trx
